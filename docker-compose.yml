
services:
  mysql:
    image: mysql:8.0
    container_name: inventory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: inventory_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - inventory-net
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10

  node-exporter:
    image: prom/node-exporter:latest
    container_name: inventory-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(mnt/wsl|mnt/c|mnt/d|Docker|usr/lib/wsl|mnt/docker-desktop|run|tmp)(/|$)"
      - "--collector.filesystem.fs-types-exclude=^(9p|overlay|tmpfs|rootfs|squashfs|iso9660)$"
      - "--collector.textfile.directory=/textfile"
    volumes:
      - /:/host:ro,rslave
      - ./monitoring/node-exporter/textfile:/textfile:ro
    ports:
      - "9100:9100"
    networks:
      - inventory-net

  prometheus:
    image: prom/prometheus:latest
    container_name: inventory-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
    networks:
      - inventory-net

  grafana:
    image: grafana/grafana:latest
    container_name: inventory-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - inventory-net


  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory-app
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: inventory_db
      FRONTEND_DIR: /frontend
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inventory-net

volumes:
  mysql_data:
  grafana_data:

networks:
  inventory-net:
    driver: bridge

